
name: Build Danish Headshot Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -1)" -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p extracted/DanishHeadshotPro assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Danish-Headshot-Pro-APK
          path: extracted/DanishHeadshotPro/app/build/outputs/apk/debug/*.apk
          
