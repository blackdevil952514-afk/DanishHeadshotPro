
name: Build Danish Headshot Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - 'app/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate project and update Java
        run: |
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          mkdir -p "$PROJECT_DIR/app/src/main/java/com/danish/headshotpro"
          cp app/src/main/java/com/danish/headshotpro/MainActivity.java "$PROJECT_DIR/app/src/main/java/com/danish/headshotpro/MainActivity.java"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug
          ls -lh "$PROJECT_DIR/app/build/outputs/apk/debug/"

      - uses: actions/upload-artifact@v4
        with:
          name: Danish-Headshot-Pro-Final-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
